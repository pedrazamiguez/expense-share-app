name: Update Version Catalog Dependencies

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  OER_APP_ID_RELEASE: ${{ secrets.OER_APP_ID_RELEASE }}
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
  GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  update_version_catalog:
    name: Update Version Catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Decode google-services.json
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          else
            echo '{"project_info":{"project_number":"0","project_id":"placeholder","storage_bucket":"placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"es.pedrazamiguez.splittrip"}},"api_key":[{"current_key":"placeholder"}]}]}' > app/google-services.json
          fi
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Update Version Catalog and Process PR
        run: |
          ./gradlew versionCatalogUpdate

          if git diff --quiet gradle/libs.versions.toml; then
            echo "✅ Version catalog is already up to date. No changes needed."
            exit 0
          fi

          echo "📦 Updates detected in gradle/libs.versions.toml."
          BRANCH_NAME="internal/version-catalog-update"

          git checkout -B "$BRANCH_NAME"
          git add gradle/libs.versions.toml
          git commit -m "chore(deps): update version catalog dependencies"
          git push origin "$BRANCH_NAME" --force

          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base develop --state open --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            echo "🔄 Existing open PR #$EXISTING_PR refreshed with new updates."
          else
            PR_BODY=$(cat <<'EOF'
          ### 🤖 Automated Version Catalog Update

          This pull request was automatically generated by the [update-version-catalog](https://github.com/${{ github.repository }}/actions/workflows/update-version-catalog.yml) workflow.

          It updates dependencies declared in `gradle/libs.versions.toml` to their latest stable releases using the `nl.littlerobots.version-catalog-update` Gradle plugin.

          ### 📋 Checklist for Reviewers
          - [ ] Verify that all CI checks (compilation, unit tests, static analysis) pass.
          - [ ] Review the updated dependencies for potential breaking changes or deprecations.
          - [ ] Run `./gradlew assembleDebug` and `make check` locally if necessary.
          EOF
          )

            gh pr create \
              --base develop \
              --head "$BRANCH_NAME" \
              --title "chore(deps): update version catalog dependencies" \
              --body "$PR_BODY" \
              --label "config"

            echo "🚀 Successfully created pull request for version catalog update."
          fi
